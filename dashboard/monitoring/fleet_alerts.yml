# fleet_alerts.yml — VOID pirate hive-mind network-monitoring alert rules
# Loaded by prometheus.yml `rule_files`. No alertmanager is wired yet, so these
# surface in the Prometheus UI (/alerts, /api/v1/rules) and are queryable from
# Grafana as the `ALERTS` series — that is the intended "at a glance, is the
# fleet healthy" view until routing is added.
#
# Fleet nodes run **windows_exporter** (Windows), not Linux node_exporter, so
# the host metrics below use the `windows_*` names. cadvisor + the GPU exporter
# use their own names. Every rule is keyed by the `node` label from
# prometheus.yml so alerts say WHICH machine.

groups:
  # ────────────────────────────────────────────────────────────────────
  - name: fleet_targets
    rules:
      - alert: FleetNodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 3m
        labels: { severity: critical, area: fleet }
        annotations:
          summary: "windows_exporter down on {{ $labels.node }}"
          description: "Prometheus cannot scrape node-exporter on {{ $labels.node }} ({{ $labels.instance }}) for >3m. Fleet CPU/RAM/disk panels for that node are blind."

      - alert: FleetGpuExporterDown
        expr: up{job="stealthattack-gpu"} == 0
        for: 5m
        labels: { severity: warning, area: gpu }
        annotations:
          summary: "GPU exporter down on {{ $labels.node }}"
          description: "The STEALTHATTACK GPU exporter ({{ $labels.instance }}) has been unreachable for >5m — GPU utilisation / cooperative-use enforcement is unobservable."

      - alert: MonitoringCadvisorDown
        expr: up{job="cadvisor"} == 0
        for: 3m
        labels: { severity: warning, area: monitoring }
        annotations:
          summary: "cAdvisor down (container metrics blind)"
          description: "cAdvisor ({{ $labels.instance }}) has not been scrapable for >3m — per-container CPU/RAM for the void-* stack is missing."

      - alert: PrometheusTargetDown
        expr: up == 0
        for: 10m
        labels: { severity: warning, area: monitoring }
        annotations:
          summary: "Prometheus target down: {{ $labels.job }} / {{ $labels.instance }}"
          description: "Target {{ $labels.job }} ({{ $labels.instance }}) has been down for >10m. Catch-all — a more specific alert may also be firing."

  # ────────────────────────────────────────────────────────────────────
  - name: fleet_hosts
    rules:
      - alert: HostHighCpu
        expr: 100 - (avg by (node, instance) (rate(windows_cpu_time_total{mode="idle"}[5m])) * 100) > 92
        for: 15m
        labels: { severity: warning, area: fleet }
        annotations:
          summary: "{{ $labels.node }} CPU pinned >92% for 15m"
          description: "Sustained CPU saturation on {{ $labels.node }}. If this is STEALTHATTACK it may be a fleet render/sim job that failed to yield to the Captain's son."

      - alert: HostLowMemory
        expr: (windows_os_physical_memory_free_bytes / windows_cs_physical_memory_bytes) * 100 < 8
        for: 10m
        labels: { severity: warning, area: fleet }
        annotations:
          summary: "{{ $labels.node }} free RAM <8%"
          description: "{{ $labels.node }} has under 8% physical memory free for >10m."

      - alert: HostDiskAlmostFull
        expr: (windows_logical_disk_free_bytes{volume=~"C:|D:"} / windows_logical_disk_size_bytes{volume=~"C:|D:"}) * 100 < 10
        for: 10m
        labels: { severity: critical, area: fleet }
        annotations:
          summary: "{{ $labels.node }} {{ $labels.volume }} <10% free"
          description: "Volume {{ $labels.volume }} on {{ $labels.node }} is below 10% free. tr3asure downloads + DB VACUUM/archive need headroom — this WILL start refusing work."

      - alert: HostDiskWillFillSoon
        expr: predict_linear(windows_logical_disk_free_bytes{volume=~"C:|D:"}[6h], 24 * 3600) < 0
        for: 30m
        labels: { severity: warning, area: fleet }
        annotations:
          summary: "{{ $labels.node }} {{ $labels.volume }} projected full in <24h"
          description: "At the last 6h fill rate, {{ $labels.volume }} on {{ $labels.node }} runs out of space within 24h."

  # ────────────────────────────────────────────────────────────────────
  - name: void_containers
    rules:
      - alert: VoidContainerDown
        expr: time() - container_last_seen{name=~"void-.*"} > 180
        for: 3m
        labels: { severity: warning, area: monitoring }
        annotations:
          summary: "Container {{ $labels.name }} not seen for >3m"
          description: "cAdvisor has not reported {{ $labels.name }} for over 3 minutes — it is likely stopped or crash-looping."

      - alert: VoidContainerHighMemory
        expr: (container_memory_usage_bytes{name=~"void-.*"} / container_spec_memory_limit_bytes{name=~"void-.*"} > 0.9) and (container_spec_memory_limit_bytes{name=~"void-.*"} > 0)
        for: 15m
        labels: { severity: info, area: monitoring }
        annotations:
          summary: "Container {{ $labels.name }} >90% of its memory limit"
          description: "{{ $labels.name }} has been above 90% of its configured memory limit for 15m — OOM-kill risk."
