global:
  scrape_interval: 5s
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['192.168.0.39:9093']
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['192.168.0.39:8081']
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['192.168.0.39:9100']
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['192.168.0.39:9093']
