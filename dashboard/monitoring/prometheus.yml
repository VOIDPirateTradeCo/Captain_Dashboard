global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # cAdvisor runs on the host bound to 127.0.0.1:8081 -> reach it via the
  # docker host gateway, not the LAN IP.
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels: { node: 'SQUIDSTATION' }

  # node-exporter: SQUIDSTATION (host) + fleet nodes over Tailscale.
  # Each fleet node shows "down" until node_exporter is running there
  # (see the crew setup cards). Ports are the node_exporter default 9100.
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels: { node: 'SQUIDSTATION' }
      - targets: ['100.106.235.103:9100']
        labels: { node: 'PINKCADY' }
      - targets: ['100.110.238.68:9100']
        labels: { node: 'STEALTHATTACK' }

  # STEALTHATTACK GPU metrics (nvidia-dcgm-exporter / nvidia_gpu_exporter,
  # default 9835). Down until Sir Azure stands it up. Card [SETUP] Grafana GPU.
  - job_name: 'stealthattack-gpu'
    static_configs:
      - targets: ['100.110.238.68:9835']
        labels: { node: 'STEALTHATTACK' }
