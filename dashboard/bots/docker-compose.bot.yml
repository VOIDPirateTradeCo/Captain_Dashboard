version: '3.8'

services:
  sir-green-bot:
    build:
      context: .
      dockerfile: Dockerfile.sirgreen
    container_name: void-sir-green-bot
    restart: unless-stopped
    environment:
      - VOID_DOCKER_ALERTS_WEBHOOK=${VOID_DOCKER_ALERTS_WEBHOOK}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - INTERVAL_SECONDS=${INTERVAL_SECONDS:-300}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - void-net

networks:
  void-net:
    external: true
