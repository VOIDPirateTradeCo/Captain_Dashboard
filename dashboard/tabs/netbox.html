<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captain Dashboard - NetBox</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            padding: 20px;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            padding: 20px;
            margin-bottom: 30px;
            border-bottom: 2px solid #0f3460;
        }
        .header h1 {
            color: #e94560;
            font-size: 2.5em;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }
        .header p {
            color: #a0a0a0;
            margin-top: 10px;
        }
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .status-card {
            background: rgba(15, 52, 96, 0.6);
            border: 1px solid #0f3460;
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s ease;
        }
        .status-card:hover {
            transform: translateY(-5px);
            border-color: #e94560;
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.3);
        }
        .status-card h3 {
            color: #e94560;
            margin-bottom: 10px;
            font-size: 1.2em;
        }
        .status-card .value {
            font-size: 2em;
            font-weight: bold;
            color: #fff;
        }
        .status-card .label {
            color: #a0a0a0;
            font-size: 0.9em;
            margin-top: 5px;
        }
        .iframe-container {
            background: rgba(15, 52, 96, 0.6);
            border: 1px solid #0f3460;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }
        .iframe-container h2 {
            color: #e94560;
            margin-bottom: 15px;
        }
        iframe {
            width: 100%;
            height: 600px;
            border: none;
            border-radius: 5px;
            background: #fff;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #a0a0a0;
        }
        .error {
            text-align: center;
            padding: 40px;
            color: #e94560;
            background: rgba(233, 69, 96, 0.1);
            border-radius: 10px;
            border: 1px solid #e94560;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏴‍☠️ NetBox Network Asset Management</h1>
        <p>Captain's Dashboard - Network Infrastructure</p>
    </div>

    <div class="status-grid">
        <div class="status-card">
            <h3>📊 Status</h3>
            <div class="value" id="netbox-status">Loading...</div>
            <div class="label">NetBox Service</div>
        </div>
        <div class="status-card">
            <h3>🗄️ Database</h3>
            <div class="value" id="db-status">Checking...</div>
            <div class="label">PostgreSQL</div>
        </div>
        <div class="status-card">
            <h3>🔄 Cache</h3>
            <div class="value" id="redis-status">Checking...</div>
            <div class="label">Redis</div>
        </div>
        <div class="status-card">
            <h3>🌐 DNS</h3>
            <div class="value" id="dns-status">Checking...</div>
            <div class="label">Dnsmasq</div>
        </div>
    </div>

    <div class="iframe-container">
        <h2>NetBox UI</h2>
        <div id="netbox-frame-container">
            <div class="loading">Loading NetBox interface...</div>
        </div>
    </div>

    <script>
        async function checkStatus() {
            try {
                const response = await fetch('/api/netbox/status');
                const data = await response.json();
                
                document.getElementById('netbox-status').textContent = data.netbox || 'Unknown';
                document.getElementById('db-status').textContent = data.database || 'Unknown';
                document.getElementById('redis-status').textContent = data.redis || 'Unknown';
                document.getElementById('dns-status').textContent = data.dns || 'Unknown';

                if (data.netbox === 'OK' && data.netbox_url) {
                    document.getElementById('netbox-frame-container').innerHTML = 
                        '<iframe src="' + data.netbox_url + '" title="NetBox UI"></iframe>';
                } else {
                    document.getElementById('netbox-frame-container').innerHTML = 
                        '<div class="error">NetBox UI not available yet</div>';
                }
            } catch (error) {
                console.error('Status check failed:', error);
                document.getElementById('netbox-status').textContent = 'Error';
            }
        }

        // Check status on load and every 30 seconds
        checkStatus();
        setInterval(checkStatus, 30000);
    </script>
</body>
</html>
