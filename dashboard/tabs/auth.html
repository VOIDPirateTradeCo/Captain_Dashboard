<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Auth & Scopes</title>
<style>
body{background:#0b1d2e;color:#ffd700;font-family:'Segoe UI',sans-serif;padding:20px;margin:0}
nav{background:#081726;padding:10px 20px;border-bottom:1px solid #1f3a55;margin:-20px -20px 18px}
nav a{color:#00aaff;text-decoration:none;margin-right:14px;font-size:14px}nav a:hover{color:#ffd700}
h1{color:#ffd700}.card{background:#122a3d;border:1px solid #1f3a55;border-radius:10px;padding:14px;margin:8px 0}
.scope{display:inline-block;background:#0a1f30;border:1px solid #56fb88;color:#56fb88;border-radius:6px;padding:4px 10px;margin:3px}
input{background:#0a1f30;color:#9fe7ff;border:1px solid #1f3a55;padding:6px;border-radius:6px;width:320px}
button{background:#5a1020;color:#ffd700;border:1px solid #ffd700;padding:6px 12px;border-radius:6px;cursor:pointer}
.status{color:#9fe7ff;font-size:.85em;margin-top:8px}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}
</style></head>
<body>
<nav><a href="/">🏠 HQ</a><a href="/tab/fleet">🛰️ Fleet</a><a href="/tab/crew">👥 Crew</a><a href="/tab/dataview">📊 Dataview</a><a href="/tab/auth">🔑 Auth</a><a href="/tab/diagram">📐 Diagram</a></nav>
<h1>🔑 CREW AUTH & SCOPES — White Whale Gating</h1>

<div class="card">
  <h2>Token Login</h2>
  <div class="row"><input id="token" placeholder="captain token (green_tide / pink_wave / azure_storm)"><button onclick="doLogin()">Verify Token</button></div>
  <div class="status" id="loginStatus"></div>
</div>

<div class="card">
  <h2>Session</h2>
  <div class="row"><button onclick="whoami()">Whoami</button><button onclick="doLogout()">Logout</button></div>
  <div class="status" id="sessionStatus"></div>
</div>

<div class="card">
  <h2>Scopes</h2>
  <div><span class="scope">green_tide → Sir Green</span><span class="scope">pink_wave → Miss Pink</span><span class="scope">azure_storm → Sir Azure</span></div>
  <div class="status" id="scopesStatus"></div>
</div>

<script>
async function api(path, opts){const r=await fetch(path, opts);let j;try{j=await r.json()}catch{j=null}return {status:r.status,data:j}}
async function doLogin(){
  const t=document.getElementById('token').value.trim();
  const el=document.getElementById('loginStatus');
  if(!t){el.textContent='token required';return}
  el.textContent='verifying...';
  const res=await api('/api/auth/verify?token='+encodeURIComponent(t));
  if(res.status===200 && res.data && res.data.authenticated){sessionStorage.setItem('token', t);el.textContent='authenticated: '+JSON.stringify(res.data);whoami()}else{el.textContent='auth failed: '+(res.data&&res.data.error?res.data.error:'unknown')}
}
async function doLogout(){
  const t=sessionStorage.getItem('token');
  if(!t){document.getElementById('sessionStatus').textContent='no session';return}
  const res=await api('/api/auth/logout',{method:'POST',headers:{'Authorization':'Bearer '+t}});
  sessionStorage.removeItem('token');
  document.getElementById('sessionStatus').textContent='logged out: '+JSON.stringify(res.data||{});
}
async function whoami(){
  const t=sessionStorage.getItem('token');
  const el=document.getElementById('sessionStatus');
  if(!t){el.textContent='no session';return}
  const res=await api('/api/auth/whoami',{headers:{'Authorization':'Bearer '+t}});
  el.textContent='status '+res.status+' '+(res.data?JSON.stringify(res.data):'');
}
async function loadScopes(){try{const d=await(await fetch('/api/auth/scopes')).json();document.getElementById('scopesStatus').textContent='valid tokens: '+(d.valid_tokens||[]).join(', ')}catch(e){document.getElementById('scopesStatus').textContent='ERR '+e.message}}
loadScopes();
</script></body></html>
