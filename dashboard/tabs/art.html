<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Art Pipeline</title>
    <style>
        body { background:#0b1d2e; color:#ffd700; font-family:sans-serif; padding:20px; margin:0; }
        nav { background:#081726; padding:10px 20px; border-bottom:1px solid #1f3a55; }
        nav a { color:#00aaff; text-decoration:none; margin-right:14px; font-size:14px; }
        nav a:hover { color:#ffd700; }
        h1 { color:#ffd700; }
        .card { background:#122a3d; border:1px solid #1f3a55; padding:15px; margin:12px 0; border-radius:8px; }
        .metric { color:#4da6ff; }
        .online { color:#56fb88; }
        .offline { color:#f85149; }
        pre { background:#0a1f30; padding:10px; border-radius:6px; overflow:auto; }
    </style>
</head>
<body>
<nav>
    <a href="/tab/captain">⚓ Captain</a>
    <a href="/tab/fleet">🛰️ Fleet</a>
    <a href="/tab/security">🛡️ Security</a>
    <a href="/tab/tickets">🎟️ Tickets</a>
    <a href="/tab/hivemind">🧠 Hive Mind</a>
    <a href="/tab/art">🎨 AI Art</a>
    <a href="/tab/monitoring">📡 Monitoring</a>
</nav>
<h1>🎨 AI Art Pipeline — Sir Azure (STEALTHATTACK)</h1>
<p class="metric" id="status">Loading ComfyUI status...</p>
<div class="card">
    <h2>ComfyUI / SDXL Rig</h2>
    <pre id="art">Loading...</pre>
</div>
<script>
async function load(){
    try {
        const res = await fetch('/api/fleet/art');
        const d = await res.json();
        const online = d.online ? 'online' : 'offline';
        const g = d.gpu && d.gpu.vram_total_gb ? `${d.gpu.name} — ${d.gpu.vram_used_gb}/${d.gpu.vram_total_gb}GB vRAM used` : 'GPU n/a';
        document.getElementById('status').innerHTML =
            `<span class="${online==='online'?'online':'offline'}">ComfyUI ${online}</span> · ${g} · queue ${d.queue_running||0} running / ${d.queue_pending||0} pending · ${d.recent_gens||0} recent gens`;
        document.getElementById('art').textContent = JSON.stringify(d, null, 2);
    } catch(e){ document.getElementById('status').textContent = 'Art pipeline error: '+e.message; }
}
load(); setInterval(load, 10000);
</script>
</body>
</html>
