<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ticketing Tab</title>
    <style>
        body { background:#0b1d2e; color:#ffd700; font-family:sans-serif; padding:20px; }
        .card { background:#122a3d; border:1px solid #1f3a55; padding:15px; margin:10px 0; border-radius:8px; }
        .metric { color:#00aaff; }
        .error { color:#ff5555; }
        .ok { color:#3fe08a; }
        pre { background:#0a1f30; padding:10px; border-radius:6px; overflow:auto; }
        table { width:100%; border-collapse:collapse; }
        th,td { text-align:left; padding:6px; border-bottom:1px solid #1f3a55; }
    </style>
</head>
<body>
    <h1>🎟️ Ticketing Tab</h1>
    <div class="card">
        <h2>Ticketing Ownership</h2>
        <div id="ownership">Loading...</div>
    </div>
    <div class="card">
        <h2>Live Status</h2>
        <pre id="status">Loading...</pre>
    </div>
    <div class="card">
        <h2>Smart Sort</h2>
        <pre id="smart">Loading...</pre>
    </div>
    <div class="card">
        <h2>Automation Issues</h2>
        <pre id="issues">Loading...</pre>
    </div>
    <div class="card">
        <h2>LAN Services</h2>
        <div id="services">Loading...</div>
    </div>
    <script>
        async function load(){
            try {
                const res = await fetch('/api/tickets');
                const data = await res.json();
                const ownership = data.ownership || data.ticketing?.ownership || {};
                document.getElementById('ownership').innerHTML = Object.entries(ownership).map(([k,v]) => `<div><strong>${k}</strong>: ${v}</div>`).join('') || '<div>No ownership mapping</div>';
                document.getElementById('status').textContent = JSON.stringify({
                    timestamp: data.timestamp,
                    ticketing: data.ticketing,
                    lan: data.lan
                }, null, 2);
                const smartSort = data.smart || {};
                document.getElementById('smart').textContent = JSON.stringify({
                    ...smartSort,
                    note: "Sort rules: P0 = dashboard/Docker/health/SSH down; P1 = ship unreachable; P2 = monitoring/ticketing degraded; P3 = optional/AI art/Torus non-critical"
                }, null, 2);
                document.getElementById('issues').textContent = JSON.stringify(data.automation || [], null, 2);
                const services = data.lan?.services || {};
                document.getElementById('services').innerHTML = '<table><tr><th>Service</th><th>Host</th><th>Port</th><th>OK</th></tr>' + Object.entries(services).map(([k,v]) => `<tr><td>${k}</td><td>${v.host||'-'}</td><td>${v.port||'-'}</td><td class=\"${v.ok?'ok':'error'}\">${v.ok?'UP':'DOWN'}</td></tr>`).join('') + '</table>';
            } catch(e){
                document.getElementById('status').textContent = 'Error: ' + e.message;
                document.getElementById('status').className = 'error';
            }
        }
        load();
        setInterval(load, 3000);
    </script>
</body>
</html>
