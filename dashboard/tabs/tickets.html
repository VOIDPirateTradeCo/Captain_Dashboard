<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ticketing Tab</title>
    <style>
        body { background:#0b1d2e; color:#ffd700; font-family:sans-serif; padding:20px; }
        .card { background:#122a3d; border:1px solid #1f3a55; padding:15px; margin:10px 0; border-radius:8px; }
        .metric { color:#00aaff; }
        .error { color:#ff5555; }
        .ok { color:#3fe08a; }
        table { width:100%; border-collapse:collapse; }
        th,td { text-align:left; padding:8px; border-bottom:1px solid #1f3a55; }
        .owner { color:#fbbf24; }
        .label { display:inline-block; background:#1f3a55; color:#ffd700; padding:2px 8px; border-radius:12px; font-size:12px; margin-right:6px; }
        .top10 { background:#b45309; color:#fff; }
        .p0 { background:#dc2626; color:#fff; }
        .p1 { background:#ea580c; color:#fff; }
        .p2 { background:#ca8a04; color:#fff; }
        .unassigned { color:#ff5555; font-weight:bold; }
    </style>
</head>
<body>
    <h1>🎟️ Ticketing Tab</h1>
    <div class="card">
        <h2>Board Overview</h2>
        <div id="overview">Loading...</div>
    </div>
    <div class="card">
        <h2>Ownership &amp; Priority</h2>
        <div style="overflow:auto; max-height:70vh;">
        <table id="tickets-table">
          <thead><tr><th>Name</th><th>Owner</th><th>Labels</th><th>Members</th></tr></thead>
          <tbody><tr><td colspan="4">Loading...</td></tr></tbody>
        </table>
        </div>
    </div>
    <div class="card">
        <h2>Live Status</h2>
        <pre id="status">Loading...</pre>
    </div>
    <div class="card">
        <h2>Automation Issues</h2>
        <div id="issues">Loading...</div>
    </div>
    <div class="card">
        <h2>LAN Services</h2>
        <div id="services">Loading...</div>
    </div>
    <script>
        function esc(str) {
            return String(str ?? '').replace(/[&<>"']/g, function(m) {
                return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m];
            });
        }
        async function load(){
            try {
                const res = await fetch('/api/tickets');
                const data = await res.json();
                const ownership = data.ownership || data.ticketing?.ownership || {};
                const tbody = document.querySelector('#tickets-table tbody');
                if (tbody) {
                    const rows = Object.entries(ownership).map(([k,v]) => {
                        const name = esc(k);
                        const owner = esc(v);
                        const ownerClass = owner === 'unassigned' ? 'unassigned' : 'owner';
                        return `<tr><td>${name}</td><td class="${ownerClass}">${owner}</td><td>-</td><td>-</td></tr>`;
                    }).join('');
                    tbody.innerHTML = rows || '<tr><td colspan="4">No ownership mapping</td></tr>';
                }
                document.getElementById('status').textContent = JSON.stringify({
                    timestamp: data.timestamp,
                    ticketing: data.ticketing,
                    lan: data.lan
                }, null, 2);
                const smartSort = data.smart || {};
                const smartEl = document.getElementById('smart');
                if (smartEl) smartEl.textContent = JSON.stringify({
                    ...smartSort,
                    note: "Sort rules: P0 = dashboard/Docker/health/SSH down; P1 = ship unreachable; P2 = monitoring/ticketing degraded; P3 = optional/AI art/Torus non-critical"
                }, null, 2);
                const issues = Array.isArray(data.automation) ? data.automation : [];
                const issuesEl = document.getElementById('issues');
                if (issuesEl) issuesEl.innerHTML = issues.length ? issues.map(i => `<div>${esc(i)}</div>`).join('') : '<div class="ok">No automation issues</div>';
                const services = data.lan?.services || {};
                const servicesEl = document.getElementById('services');
                if (servicesEl) {
                    const rows = Object.entries(services).map(([k,v]) => `<tr><td>${esc(k)}</td><td>${esc(v.host||'-')}</td><td>${esc(v.port||'-')}</td><td class="${v.ok?'ok':'error'}">${v.ok?'UP':'DOWN'}</td></tr>`).join('');
                    servicesEl.innerHTML = rows ? `<table>${rows}</table>` : '<div class="ok">No services</div>';
                }
            } catch(e){
                document.getElementById('status').textContent = 'Error: ' + e.message;
                document.getElementById('status').className = 'error';
            }
        }
        load();
        setInterval(load, 3000);
    </script>
</body>
</html>
