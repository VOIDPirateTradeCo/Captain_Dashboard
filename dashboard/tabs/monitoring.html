<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Monitoring Tab</title>
    <style>
        body { background:#0b1d2e; color:#ffd700; font-family:sans-serif; padding:20px; }
        .status-dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#555; margin-left:8px; }
        .online { color:#3fe08a; }
        .offline { color:#ff5555; }
        .card { background:#122a3d; border:1px solid #1f3a55; padding:15px; margin:10px 0; border-radius:8px; }
        .metric { color:#4da6ff; }
        .online { color:#56fb88; }
        .offline { color:#f85149; }
        a { color:#4da6ff; }
        iframe { width:100%; height:420px; border:1px solid #1f3a55; border-radius:6px; background:#000; }
        .grid { display:grid; gap:12px; }
        .col-2 { grid-template-columns: repeat(2, 1fr); }
        .col-3 { grid-template-columns: repeat(3, 1fr); }
    </style>
</head>
<body>
    <h1>📡 Local Monitoring</h1>
    <div class="card">
        <h2>Stack</h2>
        <ul>
            <li class="metric"><a href="http://192.168.0.39:3002" target="_blank">Grafana</a></li>
            <li class="metric"><a href="http://192.168.0.39:9090" target="_blank">Prometheus</a></li>
            <li class="metric"><a href="http://192.168.0.39:8081" target="_blank">cAdvisor</a></li>
            <li class="metric"><a href="http://192.168.0.39:3001" target="_blank">Uptime Kuma</a></li>
        </ul>
    </div>
    <div class="card">
        <h2>Live Status</h2>
        <p id="status">Loading...</p>
        <div id="ports" style="margin-top:8px;"></div>
    </div>
    <div class="card">
        <h2>Panels</h2>
        <div class="grid col-2">
            <div>
                <h3>Grafana <span id="grafana-status" class="status-dot"></span></h3>
                <div id="grafana-panel">Checking...</div>
            </div>
            <div>
                <h3>Uptime Kuma <span id="kuma-status" class="status-dot"></span></h3>
                <div id="kuma-panel">Checking...</div>
            </div>
        </div>
        <div class="grid col-3" style="margin-top:12px;">
            <div>
                <h3>Prometheus <span id="prometheus-status" class="status-dot"></span></h3>
                <div id="prometheus-panel">Checking...</div>
            </div>
            <div>
                <h3>cAdvisor <span id="cadvisor-status" class="status-dot"></span></h3>
                <div id="cadvisor-panel">Checking...</div>
            </div>
            <div>
                <h3>Captain API Status</h3>
                <iframe src="/api/status" sandbox="allow-scripts allow-same-origin"></iframe>
            </div>
        </div>
    </div>
    <script>
        async function load() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                const services = data.services || {};
                const internal = data.internal_services || {};
                const lines = [];
                const ports = {grafana: 3002, prometheus: 9090, cadvisor: 8081, kuma: 3001};
                for (const [key, label] of Object.entries(ports)) {
                    const ok = !!internal[key];
                    lines.push(`<span class="${ok ? 'online' : 'offline'}">${key.toUpperCase()}: ${ok ? 'UP' : 'DOWN'}</span>`);
                    const dot = document.getElementById(key+'-status');
                    if (dot) dot.style.background = ok ? '#3fe08a' : '#ff5555';
                    const panel = document.getElementById(key+'-panel');
                    if (panel) panel.innerHTML = ok ? '<span class="online">UP — dashboard routed</span>' : '<span class="offline">DOWN</span>';
                }
                document.getElementById('status').innerHTML = lines.join('<br>');
                const ports = data.services?.network_ports || {};
                const portEl = document.getElementById('ports');
                if (portEl) portEl.innerHTML = Object.entries(ports).map(([k,v])=>`<span class="${v?'online':'offline'}">${k}: ${v?'OPEN':'CLOSED'}</span>`).join('<br>');
            } catch (e) {
                document.getElementById('status').innerText = 'Failed to load status';
            }
        }
        load();
        setInterval(load, 3000);
    </script>
</body>
</html>
