<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏴‍☠️ Crew Threat Defense — Suricata / Zeek / CrowdSec</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#05070d; color:#9fe7ff; font-family:'Courier New',monospace; }
  header { padding:10px 16px; background:linear-gradient(90deg,#0a1a2a,#06121f); border-bottom:1px solid #1b3a52; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:15px; letter-spacing:2px; color:#5fd0ff; text-shadow:0 0 8px #1b6fa8; }
  header .status { font-size:12px; color:#3fe08a; }
  .wrap { padding:16px; display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px; }
  .card { background:#0a0f17; border:1px solid #1b3a52; border-radius:8px; padding:14px; }
  .card h2 { font-size:13px; color:#5fd0ff; margin-bottom:8px; letter-spacing:1px; }
  .row { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px dashed #11283a; font-size:12px; }
  .row span:last-child { color:#3fe08a; }
  .down { color:#ff6464 !important; }
  .note { font-size:11px; color:#6fa8c8; margin-top:8px; line-height:1.5; }
  .bar { position:fixed; bottom:0; width:100%; height:3px; background:linear-gradient(90deg,#0af,#0ff,#0af); animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }
  pre { white-space:pre-wrap; font-size:11px; color:#6fa8c8; }
</style>
</head>
<body>
<header>
  <h1>🏴‍☠️ PIRATE CAPTAIN'S DASHBOARD — CREW THREAT DEFENSE</h1>
  <span class="status" id="live">● LIVE · /api/security</span>
</header>
<div class="wrap" id="grid">
  <div class="card"><h2>Loading…</h2></div>
</div>
<div class="bar"></div>
<script>
async function load(){
  try{
    const r = await fetch('/api/security');
    const d = await r.json();
    const g = document.getElementById('grid');
    g.innerHTML = '';
    const comp = d.components || {};
    for (const [name,c] of Object.entries(comp)){
      const alive = c.alive;
      let rows = '';
      for (const [k,v] of Object.entries(c)){
        if (k==='alive'||k==='note') continue;
        rows += `<div class="row"><span>${k}</span><span>${v}</span></div>`;
      }
      if (c.note) rows += `<div class="note">${c.note}</div>`;
      g.innerHTML += `<div class="card"><h2>${name.toUpperCase()} ${alive?'🟢':'🔴'}</h2>${rows}</div>`;
    }
    if (d.defensive_summary) g.innerHTML += `<div class="card" style="grid-column:1/-1"><h2>DEFENSIVE SUMMARY</h2><pre>${d.defensive_summary}</pre></div>`;
    document.getElementById('live').textContent = '● LIVE · ' + (d.generated||'').slice(0,19) + 'Z';
  }catch(e){
    document.getElementById('live').textContent = '● ERROR';
  }
}
load(); setInterval(load, 15000);
</script>
</body>
</html>
