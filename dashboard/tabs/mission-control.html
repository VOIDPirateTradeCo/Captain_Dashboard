<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚀 Mission Control</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#05070d; color:#9fe7ff; font-family:'Courier New',monospace; }
  header { padding:10px 16px; background:linear-gradient(90deg,#0a1a2a,#06121f); border-bottom:1px solid #1b3a52; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:15px; letter-spacing:2px; color:#5fd0ff; text-shadow:0 0 8px #1b6fa8; }
  header .status { font-size:12px; color:#3fe08a; }
  iframe { width:100%; height:calc(100vh - 44px); border:0; background:#0a0f17; }
  .bar { position:fixed; bottom:0; width:100%; height:3px; background:linear-gradient(90deg,#0af,#0ff,#0af); animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }
</style>
</head>
<body>
<header>
  <h1>🏴‍☠️ PIRATE CAPTAIN'S DASHBOARD — MISSION CONTROL (AI AGENT ORCHESTRATION)</h1>
  <span class="status">● http://localhost:3100/ · <a href="http://localhost:3100/" target="_blank" style="color:#5fd0ff">open full ↗</a></span>
</header>
<iframe src="http://localhost:3100/" title="Mission Control"></iframe>
<div class="bar"></div>
</body>
</html>
