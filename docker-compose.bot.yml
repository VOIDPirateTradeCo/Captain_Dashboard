services:
  sir-green-bot:
    build:
      context: ./dashboard/bots
      dockerfile: Dockerfile.sirgreen
    container_name: void-sir-green-bot
    restart: unless-stopped
    env_file:
      - ./dashboard/bots/.env.sirgreen
    environment:
      - RELAY_BASE=/relay
    volumes:
      - ./dashboard/bots/relay:/relay
      - sir_green_bot_state:/state
    networks:
      - void-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sir_green_bot_state:

networks:
  void-net:
    external: true
