# VOID-local Mission Control overlay.
# Use via ./void-mc.sh (which passes -f docker-compose.yml -f docker-compose.void.yml).
# Do NOT rely on docker-compose.override.yml — it appended a second :3001 mapping
# (compose merges `ports`), which is why MC ended up on both :3000 and :3001.
# Here we set NO `ports:` — the single host binding comes from the base file's
# "${MC_PORT:-3000}:3000" with MC_PORT=3100 in .env.
services:
  mission-control:
    # NOTE: the base docker-compose.yml already hardens this service —
    # read_only rootfs + tmpfs /tmp, cap_drop: ALL, security_opt
    # no-new-privileges, resource limits. Nothing to add here for the
    # container itself (see SECURITY-POSTURE-2026-08-31.md).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      - MC_ALLOWED_HOSTS=localhost,127.0.0.1,::1,squidstation,squidstation.local,100.83.247.14,192.168.0.39,squidstation.taile6676f.ts.net
      - MC_COOKIE_SECURE=1        # enforced via HTTPS
      - MC_COOKIE_SAMESITE=lax
      - MC_ENABLE_HSTS=1          # enforced via HTTPS
      - PORT=3000                 # Next.js listens internally
      - MC_HTTPS_PORT=3001        # HTTPS proxy port inside container
      # Integration keys — values live in the gitignored .env sidecar, sourced from
      # treasure_map_keys.env. Only the 4 VOID actually holds today.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      # Skills Vault + OpenClaw runtime detection (read-only bind mounts)
      - MC_SKILLS_OPENCLAW_DIR=/run/openclaw/skills
      - MC_SKILLS_WORKSPACE_DIR=/run/skills-vault
      - OPENCLAW_STATE_DIR=/run/openclaw
    volumes:
      - type: bind
        source: /c/Users/kidsm/.openclaw
        target: /run/openclaw
        read_only: false
      - type: bind
        source: /c/Users/kidsm/AppData/Local/hermes/bin/hermes.exe
        target: /usr/local/bin/hermes.exe
        read_only: true
      - type: bind
        source: /c/Users/kidsm/Documents/My Docs/VOID Pirate Trading Co/Obsidian_Vault/04_AI_Operating_System/Skills Vault
        target: /run/skills-vault
        read_only: true
      - type: bind
        source: /c/Users/kidsm/Documents/My Docs/VOID Pirate Trading Co/Captain_Dashboard/mission-control/.backups
        target: /app/.data/backups
        read_only: false
      - type: bind
        source: /c/Users/kidsm/.openclaw/workspace-sir-green-test
        target: /workspace/sir-green-test
        read_only: false
      - type: bind
        source: /c/Users/kidsm/Documents/My Docs/VOID Pirate Trading Co/Captain_Dashboard/mission-control/AGENTS.md
        target: /app/AGENTS.md
        read_only: true
    networks:
      mc-net:

networks:
  mc-net:
    driver: bridge
