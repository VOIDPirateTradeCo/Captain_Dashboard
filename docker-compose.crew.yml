services:
  sir-green:
    build:
      context: ./dashboard/bots
      dockerfile: Dockerfile.sirgreen
    container_name: void-sir-green
    restart: unless-stopped
    env_file:
      - ./dashboard/bots/.env.sirgreen
    environment:
      - AGENT_ID=sir-green
      - AGENT_NAME="Sir Green"
      - AGENT_CAPS=code,review,ops,dashboard
      - MC_BASE=https://192.168.0.39:3100
      - RELAY_BASE=/relay
    volumes:
      - ./dashboard/bots/relay:/relay
      - sir_green_state:/state
      - /c/Users/kidsm/.openclaw:/run/openclaw:ro
    networks:
      - void-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

